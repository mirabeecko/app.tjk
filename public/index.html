<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tělovýchovná jednota Krupka — Členská aplikace</title>
  <meta name="description" content="Členská aplikace Tělovýchovná jednota Krupka: členství TJK i jednorázové vstupy na airbag, registrace, souhlasy, QR karta." />
  <meta name="theme-color" content="#06080F" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <!-- favicon: legacy .ico + moderní PNG (z TJ K loga, transparentní) -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- FONTY (design Komárka): Archivo nadpisy + Space Grotesk text, lokálně v /fonts
       (Google Fonts jsou v CSP zakázané, font-src 'self'). Preload jen těch dvou. -->
  <link rel="preload" href="/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/spacegrotesk-var-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/fonts-airbag.css?v=55" />
  <link rel="stylesheet" href="/css/app.css?v=55" />
  <link rel="stylesheet" href="/css/theme-komarka.css?v=55" />
</head>
<body>
  <!-- TRVALE VIDITELNÝ PRUH PŘIHLÁŠENÉHO PROFILU
       Je součástí shellu, takže ho žádné zobrazení neodstraní: při testování
       profilů je vždy a na každé obrazovce vidět CELÉ jméno + role + e-mail.
       Naplňuje ho renderIdentityBar() v js/ui.js. -->
  <div id="idbar" class="idbar" role="status" aria-live="polite" hidden></div>
  <div id="prog" aria-hidden="true"></div>
  <div id="app">
    <!-- HLAVIČKA (design Komárka 2026): značka + vodorovné menu + profil/CTA.
         Na mobilu jen značka + avatar; menu je ve spodní liště a panelu „Více". -->
    <header class="top">
      <div class="top-in">
        <a href="#/" class="brand">
          <img src="/img/znak-96.png" alt="" class="brand-logo" width="36" height="36" />
          <span class="brand-text">
            <strong>TJ Krupka</strong>
            <small>Členská aplikace · Airbag Komárka</small>
          </span>
        </a>
        <nav class="nav" id="topnav" aria-label="Hlavní navigace"></nav>
        <div class="top-right">
          <span class="role-pill" id="topbar-role" hidden></span>
          <span class="screen-name" id="topbar-sub" hidden>členská aplikace</span>
          <div class="top-acts" id="top-acts"></div>
          <a href="#/profil" class="topbar-avatar" id="topbar-avatar" aria-label="Můj profil" hidden></a>
        </div>
      </div>
      <button id="menu-btn" class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu" hidden></button>
      <button id="more-btn" class="more-btn" aria-label="Více" aria-expanded="false" aria-controls="mobile-menu" hidden></button>
      <nav id="mobile-menu" class="mobile-menu" hidden></nav>
    </header>

    <main id="view" class="view" role="main"></main>

    <footer class="app-footer">
      <div class="foot-in">
        <div class="foot-brand">
          <img src="/img/znak-96.png" alt="" width="28" height="28" />
          <div>
            <strong>Tělovýchovná jednota Krupka, z.s.</strong>
            <span>Areál Komárka · Horní Krupka</span>
          </div>
        </div>
        <nav class="footer-nav">
          <a href="#/pravidla">Pravidla provozu</a>
          <a href="#/podminky">Provozní řád</a>
          <a href="https://airbag-komarka-web.vercel.app/" rel="noopener">Web Airbag Komárka</a>
        </nav>
        <span class="foot-ver">verze <span class="app-verze" title="Verze aplikace (pro ověření, že se načetla nová verze)">v55</span></span>
      </div>
    </footer>
  </div>

  <nav class="bottomnav" id="bottomnav" hidden></nav>
  <div id="toast" class="toast" hidden></div>

  <script src="/js/api.js?v=55"></script>
  <script src="/js/ui.js?v=55"></script>
  <script src="/js/czech.js?v=55"></script>
  <script src="/js/md.js?v=55"></script>
  <script src="/js/views-public.js?v=55"></script>
  <script src="/js/views-member.js?v=55"></script>
  <!-- views-admin.js (16 kB) a views-dozor.js se načítají LENIVĚ až když je
       účet opravdu potřebuje (správa / dozor / vlastník). Běžný návštěvník
       tak nestahuje kód, který nikdy nepoužije — viz načtiSkript() v app.js. -->
  <script src="/js/app.js?v=55"></script>
</body>
</html>
